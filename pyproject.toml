[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boardgame-page"
version = "1.0.0"
description = "Boardgame Collection Tracker, Visual Rule Diagrams, Analytics Graphs, WhatsApp Sharing & UAE Events Hub"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q --tb=short --no-header"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
skip_covered = true
show_missing = true
